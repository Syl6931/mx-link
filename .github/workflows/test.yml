name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y imagemagick qrencode
      - run: bash -n install.sh uninstall.sh src/mxlink-session-environment.sh
      - run: sha256sum -c MANIFEST.sha256
      - run: python3 -m unittest discover -s tests -v
